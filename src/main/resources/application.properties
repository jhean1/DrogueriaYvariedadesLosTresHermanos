# ── Configuración del servidor ──────────────────────────────
server.port=8081

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
# Desactivar caché en desarrollo (activar en producción)
spring.thymeleaf.cache=false

# ── Recursos estáticos ────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ── Nombre de la aplicación ───────────────────────────────────
spring.application.name=DrogueriaLosTresHermanos

# ── Administrador ─────────────────────────────────────────────
# Las credenciales NUNCA se escriben aquí: se leen de variables de entorno.
# Si ADMIN_CLAVE no está definida, se genera una clave aleatoria en cada
# arranque y se muestra una sola vez en la consola.
app.admin.correo=${ADMIN_CORREO:admin@lostreshermanos.com}
app.admin.clave=${ADMIN_CLAVE:}

# Roles, cuentas del equipo y auditoría (no se sube al repositorio)
app.datos=${APP_DATOS:datos/accesos.properties}

# Catálogo y fotos de productos administrados desde el panel
app.catalogo=${APP_CATALOGO:datos/catalogo.properties}

# ── Base de datos MySQL ───────────────────────────────────────
# La conexión se lee de datos/conexion.properties (no se sube a GitHub) o de las
# variables de entorno APP_DB_URL, APP_DB_USUARIO y APP_DB_CLAVE en el servidor.
# Sin conexión, el catálogo usa el archivo de app.catalogo.
spring.config.import=optional:file:${APP_CONEXION:datos/conexion.properties}
app.fotos=${APP_FOTOS:datos/fotos}
# Imágenes del catálogo incluidas en el repositorio; se usan si la foto no está en app.fotos
app.fotos-repositorio=${APP_FOTOS_REPOSITORIO:fotos-productos}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# ── Sesión ────────────────────────────────────────────────────
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# En producción (HTTPS) definir COOKIE_SEGURA=true
server.servlet.session.cookie.secure=${COOKIE_SEGURA:false}
server.servlet.session.tracking-modes=cookie

# ── Errores: no exponer detalles internos al navegador ────────
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

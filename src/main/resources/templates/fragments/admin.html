<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabeza(titulo)">
  <meta charset="UTF-8">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · Panel 3H'">Panel 3H</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6F7FA">
  <link rel="icon" type="image/svg+xml" th:href="@{/img/marca/favicon.svg}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/marca/favicon-32.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <script th:src="@{/js/tema.js}"></script>
  <link rel="stylesheet" th:href="@{/css/design-system.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <script>document.documentElement.classList.add('js');</script>
</head>

<body>

<!-- Barra lateral: el servidor solo incluye lo que el rol puede abrir -->
<aside th:fragment="lateral" class="lateral" id="lateral" aria-label="Navegación del panel">
  <div class="lateral-marca">
    <a th:href="@{/admin}" aria-label="Ir al resumen"><img class="logo-claro" th:src="@{/img/marca/logo-horizontal.svg}" alt="" width="224" height="34"><img class="logo-oscuro" th:src="@{/img/marca/logo-horizontal-oscuro.svg}" alt="" width="224" height="34"></a>
    <button class="btn-icono lateral-cerrar" id="btn-cerrar-lateral" type="button" aria-label="Cerrar menú"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#cerrar"/></svg></button>
  </div>

  <nav class="lateral-nav">
    <div class="lateral-grupo">
      <a class="sidebar-item" data-seccion="resumen" th:href="@{/admin#resumen}" th:classappend="${seccionActiva == 'resumen'} ? 'activo'">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#panel"/></svg><span>Resumen</span>
      </a>
    </div>

    <div class="lateral-grupo" th:if="${perfil.operaPagos() or perfil.operaClientes() or perfil.vePedidos()}">
      <p class="lateral-titulo">Operación</p>
      <a class="sidebar-item" data-seccion="pedidos" th:href="@{/admin#pedidos}" th:if="${perfil.vePedidos()}">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#recibo"/></svg><span>Pedidos</span>
      </a>
      <a class="sidebar-item" data-seccion="solicitudes" th:href="@{/admin#solicitudes}" th:if="${perfil.operaPagos()}">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#tarjeta"/></svg><span>Solicitudes de pago</span>
        <span class="sidebar-badge" id="badge-pendientes">0</span>
      </a>
      <a class="sidebar-item" data-seccion="clientes" th:href="@{/admin#clientes}" th:if="${perfil.operaClientes()}">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#usuarios"/></svg><span>Clientes</span>
      </a>
      <a class="sidebar-item" data-seccion="crear-cliente" th:href="@{/admin#crear-cliente}" th:if="${perfil.puede('customers.create')}">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#usuario-mas"/></svg><span>Crear cliente</span>
      </a>
      <a class="sidebar-item" data-seccion="activar-plan" th:href="@{/admin#activar-plan}" th:if="${perfil.puede('subscriptions.activate')}">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#estrella"/></svg><span>Activar plan en tienda</span>
      </a>
    </div>

    <div class="lateral-grupo" th:if="${perfil.veProductos()}">
      <p class="lateral-titulo">Catálogo</p>
      <a class="sidebar-item" th:href="@{/admin/productos}" th:classappend="${seccionActiva == 'productos'} ? 'activo'" th:attrappend="aria-current=${seccionActiva == 'productos'} ? 'page'">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#capsula"/></svg><span>Productos</span>
      </a>
      <a class="sidebar-item" th:href="@{/admin/categorias}" th:if="${perfil.puede('products.update')}" th:classappend="${seccionActiva == 'categorias'} ? 'activo'" th:attrappend="aria-current=${seccionActiva == 'categorias'} ? 'page'">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#etiqueta"/></svg><span>Categorías</span>
      </a>
    </div>

    <div class="lateral-grupo" th:if="${!perfil.modulos().isEmpty()}">
      <p class="lateral-titulo">Gestión</p>
      <a class="sidebar-item" th:each="m : ${perfil.modulos()}" th:href="@{${m.ruta}}" th:classappend="${seccionActiva == m.slug} ? 'activo'" th:attrappend="aria-current=${seccionActiva == m.slug} ? 'page'">
        <svg class="ic" aria-hidden="true"><use th:href="'/img/iconos.svg#' + ${m.icono}"/></svg><span th:text="${m.nombre}">Módulo</span>
        <span class="lateral-etiqueta" th:if="${m.slug != 'auditoria'}">Pronto</span>
      </a>
    </div>

    <div class="lateral-grupo" th:if="${perfil.gestionaAccesos()}">
      <p class="lateral-titulo">Administración</p>
      <a class="sidebar-item" th:href="@{/admin/accesos}" th:classappend="${seccionActiva == 'accesos'} ? 'activo'" th:attrappend="aria-current=${seccionActiva == 'accesos'} ? 'page'">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#llave"/></svg><span>Usuarios y permisos</span>
      </a>
    </div>
  </nav>

  <a class="lateral-pie" th:href="@{/}" target="_blank" rel="noopener">
    <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#tienda"/></svg><span>Ver la tienda</span>
  </a>
</aside>

<!-- Encabezado: migas, búsqueda, avisos y perfil -->
<header th:fragment="superior(miga)" class="superior">
  <button class="btn-icono superior-menu" id="btn-abrir-lateral" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="lateral"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#menu"/></svg></button>
  <nav class="migas" aria-label="Ruta">
    <a th:href="@{/admin}">Panel</a><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#chevron"/></svg><span aria-current="page" id="miga-actual" th:text="${miga}">Resumen</span>
  </nav>

  <div class="superior-derecha">
    <div class="buscador-panel" id="buscador-panel" th:if="${perfil.operaPagos() or perfil.operaClientes()}">
      <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#buscar"/></svg>
      <label class="solo-lector" for="busqueda-global">Buscar clientes y solicitudes</label>
      <input type="search" id="busqueda-global" placeholder="Buscar clientes y solicitudes" autocomplete="off">
      <div class="menu-flotante resultados-busqueda" id="resultados-busqueda" hidden></div>
    </div>

    <button class="btn-icono btn-tema" type="button" data-tema-boton aria-label="Cambiar el tema de color">
      <svg class="ic tema-luna" aria-hidden="true"><use href="/img/iconos.svg#luna"/></svg>
      <svg class="ic tema-sol" aria-hidden="true"><use href="/img/iconos.svg#sol"/></svg>
    </button>

    <div class="menu-contenedor" th:if="${perfil.operaPagos()}">
      <button class="btn-icono boton-avisos" id="btn-avisos" type="button" aria-label="Avisos" aria-expanded="false" aria-controls="menu-avisos">
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#campana"/></svg><span class="avisos-punto" id="avisos-punto" hidden></span>
      </button>
      <div class="menu-flotante" id="menu-avisos" hidden></div>
    </div>

    <div class="menu-contenedor">
      <button class="usuario-boton" id="btn-usuario" type="button" aria-expanded="false" aria-controls="menu-usuario">
        <span class="usuario-avatar" th:text="${#strings.toUpperCase(#strings.substring(perfil.correo(), 0, 1))}">A</span>
        <span class="usuario-datos"><strong class="topbar-admin-nombre" th:text="${perfil.correo()}">correo</strong><small th:text="${perfil.rolNombre()}">Rol</small></span>
        <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#chevron-abajo"/></svg>
      </button>
      <div class="menu-flotante menu-usuario" id="menu-usuario" hidden>
        <div class="menu-usuario-cabeza"><strong th:text="${perfil.correo()}">correo</strong><span class="insignia insignia--azul" th:text="${perfil.rolNombre()}">Rol</span></div>
        <form method="post" th:action="@{/admin/logout}">
          <button class="menu-opcion" type="submit"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#salir"/></svg> Cerrar sesión</button>
        </form>
      </div>
    </div>
  </div>
</header>

<th:block th:fragment="velo">
  <div class="lateral-velo" id="lateral-velo"></div>
</th:block>

</body>
</html>

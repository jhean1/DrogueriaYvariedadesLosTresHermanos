<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: cabeza('Categorías')}"></head>
<body class="panel" th:attr="data-permisos=${perfil.permisosComoTexto()}">
  <div th:replace="~{fragments/admin :: lateral}"></div>
  <th:block th:replace="~{fragments/admin :: velo}"></th:block>
  <div class="panel-principal">
    <header th:replace="~{fragments/admin :: superior('Categorías')}"></header>
    <main class="panel-contenido" id="contenido">
      <div class="pagina-cabeza">
        <div>
          <h1>Categorías</h1>
          <p>Organizan los filtros y el índice de la tienda. Una categoría con productos no se puede eliminar.</p>
        </div>
      </div>

      <div class="alerta alerta--exito" role="status" th:if="${mensaje}"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#check"/></svg><span th:text="${mensaje}">Listo</span></div>
      <div class="alerta alerta--peligro" role="alert" th:if="${error}"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#alerta"/></svg><span th:text="${error}">Error</span></div>

      <div class="rejilla-categorias">
        <article class="tarjeta" th:each="grupo : ${ {'medicamento', 'variedad'} }" th:with="lista=${grupo == 'medicamento' ? medicamentos : variedades}">
          <div class="tarjeta-cabeza"><h2 th:text="${grupo == 'medicamento' ? 'Medicamentos' : 'Variedades'}">Grupo</h2></div>
          <div>
            <div class="fila-categoria" th:each="c : ${lista}" th:with="usos=${catalogo.usosCategoria(c.id())}">
              <form method="post" th:action="@{/admin/categorias}">
                <input type="hidden" name="id" th:value="${c.id()}">
                <label class="solo-lector" th:for="'cat-' + ${c.id()}" th:text="'Nombre de ' + ${c.nombre()}">Nombre</label>
                <input th:id="'cat-' + ${c.id()}" name="nombre" type="text" maxlength="40" required th:value="${c.nombre()}">
                <button class="btn btn--secundario btn--sm" type="submit">Guardar</button>
              </form>
              <span class="insignia num" th:text="${usos} + (${usos == 1} ? ' producto' : ' productos')">0</span>
              <form method="post" th:if="${usos == 0}" th:action="@{'/admin/categorias/' + ${c.id()} + '/eliminar'}"
                    th:attr="data-confirmar=${'La categoría «' + c.nombre() + '» desaparecerá de los filtros de la tienda.'},data-confirmar-titulo='Eliminar categoría',data-confirmar-accion='Eliminar',data-confirmar-peligro='1'">
                <button class="btn-icono" type="submit" th:attr="aria-label=${'Eliminar ' + c.nombre()}"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#papelera"/></svg></button>
              </form>
            </div>
          </div>
          <form class="nueva-categoria" method="post" th:action="@{/admin/categorias}">
            <input type="hidden" name="tipo" th:value="${grupo}">
            <div class="campo">
              <label th:for="'nueva-' + ${grupo}">Nueva categoría</label>
              <input th:id="'nueva-' + ${grupo}" name="nombre" type="text" maxlength="40" required>
            </div>
            <button class="btn btn--primario btn--sm" type="submit">Agregar</button>
          </form>
        </article>
      </div>
    </main>
  </div>
  <script th:src="@{/js/seguridad.js}"></script>
  <script th:src="@{/js/experiencia.js}"></script>
  <script th:src="@{/js/panel.js}"></script>
</body>
</html>

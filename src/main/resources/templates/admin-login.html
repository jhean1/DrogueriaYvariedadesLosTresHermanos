<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso del equipo · Los Tres Hermanos</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B2A6B">
  <link rel="icon" type="image/svg+xml" th:href="@{/img/marca/favicon.svg}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/marca/favicon-32.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/design-system.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="acceso-equipo">
  <main class="acceso">
    <img class="acceso-logo logo-claro" th:src="@{/img/marca/logo-vertical.svg}" alt="Droguería y Variedades Los Tres Hermanos" width="240" height="160">
    <img class="acceso-logo logo-oscuro" th:src="@{/img/marca/logo-vertical-oscuro.svg}" alt="Droguería y Variedades Los Tres Hermanos" width="240" height="160">
    <div class="acceso-tarjeta">
      <h1>Acceso del equipo</h1>
      <p class="acceso-sub">Exclusivo para el personal autorizado de la droguería.</p>

      <div class="alerta alerta--peligro" role="alert" th:if="${param.error}"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#alerta"/></svg><span>Usuario o contraseña incorrectos.</span></div>
      <div class="alerta alerta--aviso" role="alert" th:if="${param.bloqueado}"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#reloj"/></svg><span>Demasiados intentos fallidos. Espera 15 minutos e inténtalo de nuevo.</span></div>
      <div class="alerta alerta--aviso" role="alert" th:if="${param.inactiva}"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#candado"/></svg><span>Tu cuenta fue desactivada. Consulta con el propietario.</span></div>
      <div class="alerta alerta--exito" role="status" th:if="${param.salir}"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#check"/></svg><span>Cerraste sesión correctamente.</span></div>

      <form method="post" th:action="@{/admin/login}" id="form-acceso">
        <div class="campo">
          <label for="admin-correo">Correo</label>
          <div class="campo-icono"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#correo"/></svg>
            <input type="email" id="admin-correo" name="correo" autocomplete="username" required></div>
        </div>
        <div class="campo">
          <label for="admin-clave">Contraseña</label>
          <div class="campo-icono"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#candado"/></svg>
            <input type="password" id="admin-clave" name="clave" autocomplete="current-password" required>
            <button type="button" class="btn-ojo" onclick="toggleClave()" aria-label="Mostrar u ocultar contraseña"><svg class="ic" id="ojo-icono" aria-hidden="true"><use href="/img/iconos.svg#ojo"/></svg></button></div>
        </div>
        <button class="btn btn--primario btn--lg btn--bloque" type="submit" id="btn-acceso">
          <span class="btn-texto">Ingresar al panel</span><span class="btn-spinner"></span>
        </button>
      </form>
    </div>
    <a class="acceso-volver" th:href="@{/}"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#flecha-izq"/></svg> Volver al sitio</a>
  </main>

  <script th:src="@{/js/seguridad.js}"></script>
  <script>
  function toggleClave() {
    const inp = document.getElementById('admin-clave');
    inp.type  = inp.type === 'password' ? 'text' : 'password';
  }
  document.getElementById('form-acceso').addEventListener('submit', () => {
    const btn = document.getElementById('btn-acceso');
    btn.querySelector('.btn-texto').hidden = true;
    btn.querySelector('.btn-spinner').classList.add('visible');
  });
  </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/tienda :: cabeza('Variedades', 'Perfumes, útiles escolares y cuidado personal en Los Tres Hermanos.')}"></head>
<body class="tema-variedades">
  <th:block th:replace="~{fragments/tienda :: barra}"></th:block>

  <main id="contenido">
    <section class="catalogo-cabecera">
      <div class="contenedor">
        <nav class="migas" aria-label="Ruta"><a th:href="@{/}">Inicio</a><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#chevron"/></svg><span aria-current="page">Variedades</span></nav>
        <h1 class="titulo-pagina">Variedades</h1>
        <p class="cabecera-texto">Tu bienestar también está en los pequeños detalles.</p>
        <div class="filtros-wrap" id="filtros-variedades" role="group" aria-label="Filtrar por categoría"></div>
      </div>
    </section>

    <section class="contenedor catalogo">
      <div class="resultados-info">
        <span id="contador-resultados" role="status"></span>
        <div class="resultados-controles">
          <div class="filtro-lista">
            <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#buscar"/></svg>
            <label class="solo-lector" for="filtro-variedades-texto">Filtrar esta lista</label>
            <input type="search" id="filtro-variedades-texto" placeholder="Filtrar esta lista" autocomplete="off">
          </div>
        </div>
      </div>
      <div class="variedades-grid" id="variedades-grid"></div>
    </section>
  </main>

  <button class="fab-carrito no-imprimir" id="fab-carrito" type="button" aria-label="Abrir carrito" onclick="abrirDrawer()">
    <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#carrito"/></svg>
    <span class="fab-badge">0</span>
  </button>

  <th:block th:replace="~{fragments/tienda :: pie}"></th:block>
  <th:block th:replace="~{fragments/tienda :: carrito}"></th:block>
  <th:block th:replace="~{fragments/tienda :: scripts}"></th:block>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const esc = Seguridad.esc;
      const parametros = new URLSearchParams(location.search);
      const cats = CATEGORIAS.filter(c => c.tipo === 'variedad');
      let filtroActivo = cats.some(c => c.id === parametros.get('cat')) ? parametros.get('cat') : 'all';

      const indice = Buscador.indice().filter(e => e.tipo === 'variedad');
      let busqueda = parametros.get('q') || '';
      const entrada = document.getElementById('filtro-variedades-texto');
      entrada.value = busqueda;
      entrada.addEventListener('input', (e) => { busqueda = e.target.value.trim(); render(); });
      const filtros = document.getElementById('filtros-variedades');
      filtros.innerHTML = [{ id: 'all', nombre: 'Todos' }, ...cats].map(c =>
        `<button class="chip-filtro ${c.id === filtroActivo ? 'activo' : ''}" data-cat="${esc(c.id)}" type="button" aria-pressed="${c.id === filtroActivo}">${esc(c.nombre)}</button>`).join('');

      function render() {
        const base = busqueda ? Buscador.buscar(busqueda, indice).map(e => e.p) : VARIEDADES;
        const lista = filtroActivo === 'all' ? base : base.filter(v => v.cat === filtroActivo);
        document.getElementById('contador-resultados').innerHTML = `<strong>${lista.length}</strong> producto${lista.length !== 1 ? 's' : ''}${busqueda ? ` para "${esc(busqueda)}"` : ''}`;
        document.getElementById('variedades-grid').innerHTML = lista.length
          ? lista.map(Ficha.tarjetaVariedad).join('')
          : `<div class="vacio vacio-busqueda"><div class="vacio-icono">${Experiencia.icono('bolsa')}</div><h3>No encontramos productos aquí</h3><p>Prueba con otra categoría o escríbenos por WhatsApp.</p></div>`;
      }

      render();
      filtros.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip-filtro');
        if (!chip) return;
        filtros.querySelectorAll('.chip-filtro').forEach(c => { c.classList.toggle('activo', c === chip); c.setAttribute('aria-pressed', c === chip); });
        filtroActivo = chip.dataset.cat;
        render();
      });
      initAvatar({ perfilUrl: '/perfil', logoutUrl: '/' });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/tienda :: cabeza('Variedades', 'Perfumes, útiles escolares y cuidado personal en Los Tres Hermanos.')}"></head>
<body class="tema-variedades">
  <th:block th:replace="~{fragments/tienda :: barra}"></th:block>

  <main id="contenido">
    <section class="variedades-cabecera">
      <div class="contenedor variedades-cabecera-interior">
        <div>
          <nav class="migas" aria-label="Ruta"><a th:href="@{/}">Inicio</a><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#chevron"/></svg><span aria-current="page">Variedades</span></nav>
          <h1 class="titulo-pagina">Lo cotidiano,<br><em>con otro estilo.</em></h1>
          <p class="cabecera-texto">Perfumes, útiles escolares, cuidado personal y más.</p>
        </div>
        <div class="variedades-collage" id="variedades-collage" aria-hidden="true"></div>
      </div>
    </section>

    <section class="contenedor catalogo">
      <div class="filtros-wrap" role="group" aria-label="Filtrar por categoría">
        <button class="chip-filtro activo" data-cat="all" type="button">Todos</button>
        <button class="chip-filtro" data-cat="perfumes" type="button">Perfumes</button>
        <button class="chip-filtro" data-cat="utiles" type="button">Útiles escolares</button>
        <button class="chip-filtro" data-cat="cuidado" type="button">Cuidado personal</button>
      </div>
      <div class="variedades-grid" id="variedades-grid"></div>
    </section>
  </main>

  <button class="fab-carrito no-imprimir" id="fab-carrito" type="button" aria-label="Abrir carrito" onclick="abrirDrawer()">
    <svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#carrito"/></svg>
    <span class="fab-badge">0</span>
  </button>

  <th:block th:replace="~{fragments/tienda :: pie}"></th:block>
  <th:block th:replace="~{fragments/tienda :: carrito}"></th:block>
  <th:block th:replace="~{fragments/tienda :: scripts}"></th:block>
  <script th:src="@{/js/arte.js}"></script>
  <script th:src="@{/js/variedades-data.js}"></script>
  <script>
    const CAT_LABELS = { perfumes:'Perfume', utiles:'Útil Escolar', cuidado:'Cuidado Personal' };
    // Helper: precio con descuento de suscripción
    function renderVarPrecio(precio) {
      const desc = window.Suscripcion ? window.Suscripcion.descuento() : 0;
      if (!desc) return `<span class="var-precio">${formatPrecio(precio)}</span>`;
      const precioDesc = Math.round(precio * (1 - desc / 100));
      return `<span class="var-precio-original">${formatPrecio(precio)}</span>
              <span class="var-precio con-descuento">${formatPrecio(precioDesc)}</span>`;
    }

    let filtroActivo = 'all';

    function render() {
      const lista = filtroActivo === 'all' ? VARIEDADES : VARIEDADES.filter(v => v.cat === filtroActivo);
      const grid = document.getElementById('variedades-grid');
      grid.innerHTML = lista.map((v,i) => `
        <article class="var-card var-card--${v.cat}" style="--i:${Math.min(i, 9)}">
          <div class="var-arte">${Arte.variedad(v)}</div>
          <div class="var-body">
            <span class="var-cat">${CAT_LABELS[v.cat]||v.cat}</span>
            <h2 class="var-nombre">${v.nombre}</h2>
          </div>
          <div class="var-footer">
            <div class="var-precios">${renderVarPrecio(v.precio)}</div>
            <button type="button" class="btn-agregar-var" data-id="${v.id}" aria-label="Agregar ${v.nombre} al carrito"><svg class="ic" aria-hidden="true"><use href="/img/iconos.svg#mas"/></svg></button>
          </div>
        </article>
      `).join('');

      grid.querySelectorAll('.btn-agregar-var').forEach(btn => {
        btn.addEventListener('click', () => {
          const v = VARIEDADES.find(p => p.id === +btn.dataset.id);
          if (v) {
            const precioFinal = window.Suscripcion ? window.Suscripcion.aplicar(v.precio) : v.precio;
            Carrito.agregar({ id: v.id, nombre: v.nombre, precio: precioFinal, imagen: v.imagen });
          }
          renderDrawer();
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
      initAvatar({ perfilUrl: '/perfil', logoutUrl: '/' });
      document.getElementById('variedades-collage').innerHTML =
        [VARIEDADES[0], VARIEDADES[6], VARIEDADES[8]].map(v => `<div>${Arte.variedad(v)}</div>`).join('');
      document.querySelectorAll('.chip-filtro').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.chip-filtro').forEach(c => c.classList.remove('activo'));
          chip.classList.add('activo');
          filtroActivo = chip.dataset.cat;
          render();
        });
      });
  });
</script>
</body>
</html>
